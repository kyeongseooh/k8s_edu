# ConfigMap 값을 환경변수로 넣는 두 가지 방법
apiVersion: v1
kind: Pod
metadata:
  name: env-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    env:                           # 방법 1: key 하나를 골라서, 원하는 변수 이름으로
    - name: COLOR                  #   컨테이너 안에서 보일 환경변수 이름
      valueFrom:
        configMapKeyRef:
          name: web-config         #   ConfigMap 이름
          key: APP_COLOR           #   가져올 key
    envFrom:                       # 방법 2: ConfigMap의 모든 key를 한꺼번에
    - configMapRef:
        name: web-config
