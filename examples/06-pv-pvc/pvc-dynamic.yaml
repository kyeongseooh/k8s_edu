# 정상 기준: 실제로 존재하는 StorageClass를 써서 동적으로 PV를 받는 PVC.
# storageClassName은 본인 클러스터에 맞게 바꾸세요 (kubectl get sc 로 확인).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ch06-dyn-pvc
  labels:
    edu-chapter: "06-pv-pvc"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs-client
