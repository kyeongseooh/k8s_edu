<rect width="900" height="300" fill="#ffffff"/>
<text x="450.0" y="30" font-size="18" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">스케줄러는 두 단계로 노드를 고른다</text>
<rect x="20" y="100" width="130" height="80" rx="8" fill="#f1eafd" stroke="#7c3aed" stroke-width="1.5"/>
<text x="85.0" y="129.0" font-size="14" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">새 Pod</text>
<text x="85.0" y="147.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">노드 미정</text>
<text x="85.0" y="162.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">(Pending)</text>
<rect x="215" y="60" width="280" height="170" rx="8" fill="#fdecec" stroke="#e03131" stroke-width="1.5"/>
<text x="355.0" y="80" font-size="14" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">1. 걸러 내기 (Filter)</text>
<text x="355" y="112" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">✕ 자원이 모자란 노드</text>
<text x="355" y="136" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">✕ taint를 못 견디는 노드</text>
<text x="355" y="160" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">✕ nodeSelector/affinity 불일치</text>
<text x="355" y="184" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">✕ anti-affinity 위반</text>
<rect x="560" y="60" width="180" height="170" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="650.0" y="80" font-size="14" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">2. 점수 매기기</text>
<text x="650" y="112" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">남은 노드 중에서</text>
<text x="650" y="134" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">여유 자원, 분산 정도,</text>
<text x="650" y="156" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">선호(preferred) 조건을</text>
<text x="650" y="178" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">따져 가장 좋은 노드 선택</text>
<rect x="800" y="100" width="85" height="80" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/>
<text x="842.5" y="136.5" font-size="14" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">배치</text>
<text x="842.5" y="154.5" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">Running</text>
