# 고장 실습: StatefulSet의 serviceName과 실제 Service 이름이 다르다
apiVersion: v1
kind: Service
metadata:
  name: cache                  # Service 이름은 cache
spec:
  clusterIP: None
  selector:
    app: cache
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
spec:
  serviceName: cache-svc       # 틀림! 실제 Service 이름은 cache
  replicas: 2
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        command: ["sh", "-c"]
        args:
        - echo "$(hostname)" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
