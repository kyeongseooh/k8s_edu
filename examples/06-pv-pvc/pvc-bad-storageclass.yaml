# 오류 주입: 존재하지 않는 StorageClass를 참조 → Pending에서 멈춤 (실제로 적용해도 안전:
# 바인딩되지 않으므로 PV가 생기지 않습니다. 이름이 실제로 없는지는 본문 4-1에서 먼저 확인합니다.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ch06-pvc-badsc
  labels:
    edu-chapter: "06-pv-pvc"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ch06-does-not-exist-sc
