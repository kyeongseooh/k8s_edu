apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: edu-health}
  template:
    metadata:
      labels: {app: edu-health}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        command: [sh, -ec]
        args: ['printf ready > /usr/share/nginx/html/ready; exec nginx -g "daemon off;"']
        ports:
        - {name: http, containerPort: 80}
        startupProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 2
          failureThreshold: 15
        readinessProbe:
          httpGet: {path: /ready, port: http}
          periodSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: health-web
spec:
  selector: {app: edu-health}
  ports:
  - {port: 80, targetPort: http}
