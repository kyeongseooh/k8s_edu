<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
<defs><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#374151"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e03131"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22a05a"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#22a05a"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82f6"/></marker><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f08c00"/></marker><marker id="so" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f08c00"/></marker><marker id="ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="sp" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450.0" y="30" font-size="18" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Service 타입: 어디에서 접속할 수 있는가</text>
<rect x="20" y="55" width="860" height="325" rx="8" fill="#f1eafd" stroke="#7c3aed" stroke-width="1.5"/>
<text x="450.0" y="75" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">LoadBalancer — 클라우드/사내 로드밸런서가 외부 IP를 하나 준다</text>
<rect x="45" y="100" width="810" height="260" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/>
<text x="450.0" y="120" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">NodePort — 모든 노드의 특정 포트(30000~32767)를 연다</text>
<rect x="70" y="145" width="760" height="195" rx="8" fill="#fff3e0" stroke="#f08c00" stroke-width="1.5"/>
<text x="450.0" y="165" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">ClusterIP (기본값) — 클러스터 안에서만 통하는 고정 IP</text>
<rect x="240" y="230" width="120" height="55" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="300.0" y="261.0" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Pod</text>
<rect x="390" y="230" width="120" height="55" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="450.0" y="261.0" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Pod</text>
<rect x="540" y="230" width="120" height="55" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="600.0" y="261.0" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Pod</text>
<text x="450" y="195" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">Service 이름 / ClusterIP:80</text>
<line x1="450" y1="202" x2="300" y2="228" stroke="#f08c00" stroke-width="1.8" marker-end="url(#eo)"/>
<line x1="450" y1="202" x2="450" y2="228" stroke="#f08c00" stroke-width="1.8" marker-end="url(#eo)"/>
<line x1="450" y1="202" x2="600" y2="228" stroke="#f08c00" stroke-width="1.8" marker-end="url(#eo)"/>
<text x="450" y="318" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">바깥 타입은 안쪽 타입의 기능을 포함합니다 (NodePort를 만들면 ClusterIP도 함께 생깁니다)</text>
</svg>
