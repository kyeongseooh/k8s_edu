<rect width="900" height="330" fill="#ffffff"/>
<text x="450.0" y="30" font-size="18" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">etcd 백업과 복원: 시간을 스냅샷 시점으로 되돌린다</text>
