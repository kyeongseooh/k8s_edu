# ConfigMap의 index.html을 파일로 마운트해서 nginx가 그 파일을 응답하게 한다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        envFrom:                             # 환경변수로도 넣어 둔다 (5절 비교 실습용)
        - configMapRef:
            name: web-config
        volumeMounts:
        - name: html                         # 아래 volumes의 이름과 연결
          mountPath: /usr/share/nginx/html   # 이 디렉터리에 파일이 나타난다
      volumes:
      - name: html
        configMap:
          name: web-config
          items:                             # 이 key만 파일로 만든다 (생략하면 모든 key가 파일이 된다)
          - key: index.html
            path: index.html                 # 만들어질 파일 이름
