apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: reader
    image: nginx:1.27-alpine
    command: ["sleep", "3600"]
    env:
    - name: ENV
      valueFrom:
        secretKeyRef:          # ConfigMap 때의 configMapKeyRef와 동일 패턴
          name: secret-edu05
          key: env
    imagePullPolicy: IfNotPresent
  restartPolicy: Always
