apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-report
spec:
  schedule: "15 2 * * *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
          - name: report
            image: nginx:1.27-alpine
            imagePullPolicy: IfNotPresent
            command: [sh, -ec]
            args:
            - |
              if [ "$REPORT_MODE" != daily ]; then printf 'unknown report mode: %s\n' "$REPORT_MODE" >&2; exit 2; fi
              printf 'report generated: %s\n' "$REPORT_MODE"
            env:
            - {name: REPORT_MODE, value: daily}
