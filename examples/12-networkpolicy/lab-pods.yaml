# 실습 Pod 3개 (모두 nginx:1.27-alpine → sh/wget 내장, 기본 nginx 서버로 계속 떠 있음)
# namespace는 적지 않음 — k()(kubectl -n "$NS")가 적용 시점에 네임스페이스를 넣어줍니다.
apiVersion: v1
kind: Pod
metadata:
  name: billing-db
  labels:
    role: db
spec:
  containers:
  - name: billing-db
    image: nginx:1.27-alpine
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: checkout-app
  labels:
    role: frontend
spec:
  containers:
  - name: checkout-app
    image: nginx:1.27-alpine
    imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Pod
metadata:
  name: scanner-bot
  labels:
    role: hacker
spec:
  containers:
  - name: scanner-bot
    image: nginx:1.27-alpine
    imagePullPolicy: IfNotPresent
