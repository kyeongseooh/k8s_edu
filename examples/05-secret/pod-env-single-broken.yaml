# 의도적 오류 예제: Secret에 없는 key(env2)를 참조합니다.
# -> 컨테이너가 시작조차 못하고 CreateContainerConfigError 상태가 됩니다.
apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: reader
    image: nginx:1.27-alpine
    command: ["sleep", "3600"]
    env:
    - name: ENV
      valueFrom:
        secretKeyRef:
          name: secret-edu05
          key: env2              # 오타! 실제 key는 env (의도적 오류)
    imagePullPolicy: IfNotPresent
  restartPolicy: Always
