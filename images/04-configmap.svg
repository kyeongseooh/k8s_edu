<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370">
<defs><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#374151"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e03131"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22a05a"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#22a05a"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82f6"/></marker><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f08c00"/></marker><marker id="so" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f08c00"/></marker><marker id="ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="sp" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker></defs>
<rect width="880" height="370" fill="#ffffff"/>
<text x="440.0" y="30" font-size="18" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">ConfigMap의 값을 Pod에 넣는 두 가지 방법</text>
<rect x="20" y="70" width="250" height="260" rx="8" fill="#fff3e0" stroke="#f08c00" stroke-width="1.5"/>
<text x="145.0" y="90" font-size="14" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">ConfigMap: web-config</text>
<rect x="40" y="110" width="210" height="34" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="145.0" y="130.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827">APP_MODE: dev</text>
<rect x="40" y="152" width="210" height="34" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="145.0" y="172.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827">APP_COLOR: blue</text>
<rect x="40" y="194" width="210" height="110" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="145" y="216" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827">index.html:</text>
<text x="145" y="244" font-size="11" font-family="'DejaVu Sans Mono',Consolas,monospace" text-anchor="middle" fill="#4b5563">&lt;h1&gt;Hello ...&lt;/h1&gt;</text>
<text x="145" y="264" font-size="11" font-family="'DejaVu Sans Mono',Consolas,monospace" text-anchor="middle" fill="#4b5563">&lt;p&gt;mode: dev&lt;/p&gt;</text>
<rect x="520" y="60" width="340" height="125" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/>
<text x="690" y="84" font-size="14" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Pod (방법 1: 환경변수)</text>
<rect x="540" y="98" width="300" height="72" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="690" y="120" font-size="12" font-family="'DejaVu Sans Mono',Consolas,monospace" text-anchor="middle" fill="#111827">$APP_MODE = dev</text>
<text x="690" y="142" font-size="12" font-family="'DejaVu Sans Mono',Consolas,monospace" text-anchor="middle" fill="#111827">$APP_COLOR = blue</text>
<text x="690" y="160" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#e03131">Pod 시작 때 한 번 읽음</text>
<rect x="520" y="215" width="340" height="125" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="690" y="239" font-size="14" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Pod (방법 2: 파일로 마운트)</text>
<rect x="540" y="253" width="300" height="72" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="690" y="275" font-size="12" font-family="'DejaVu Sans Mono',Consolas,monospace" text-anchor="middle" fill="#111827">/usr/share/nginx/html/index.html</text>
<text x="690" y="297" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">key = 파일 이름, value = 파일 내용</text>
<text x="690" y="315" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#22a05a">ConfigMap을 고치면 파일도 따라 바뀜</text>
<line x1="272" y1="140" x2="518" y2="120" stroke="#374151" stroke-width="1.8" marker-end="url(#ea)"/>
<text x="395.0" y="120.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#374151">env / envFrom</text>
<line x1="272" y1="250" x2="518" y2="278" stroke="#374151" stroke-width="1.8" marker-end="url(#ea)"/>
<text x="395.0" y="254.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#374151">volumes + volumeMounts</text>
</svg>
