apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-frontend
spec:
  podSelector:                   # 이 정책을 적용할 대상 Pod
    matchLabels:
      app: db
  policyTypes:
  - Ingress                      # 들어오는 트래픽을 제어한다
  ingress:
  - from:                        # 아래 조건에 맞는 곳에서 오는 것만 허용
    - podSelector:
        matchLabels:
          role: frontend
    ports:
    - protocol: TCP
      port: 80
