<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
<defs><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#374151"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e03131"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22a05a"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#22a05a"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82f6"/></marker><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f08c00"/></marker><marker id="so" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f08c00"/></marker><marker id="ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="sp" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="380" fill="#ffffff"/>
<text x="450.0" y="30" font-size="18" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">노드를 고르는 두 방향</text>
<rect x="20" y="55" width="420" height="305" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="230.0" y="75" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">nodeSelector / affinity — Pod가 노드를 고른다</text>
<rect x="40" y="100" width="130" height="60" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/>
<text x="105.0" y="126.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Pod</text>
<text x="105.0" y="143.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">disktype=ssd 원함</text>
<rect x="280" y="85" width="140" height="60" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="350.0" y="111.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">노드 A</text>
<text x="350.0" y="128.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">disktype=ssd</text>
<rect x="280" y="165" width="140" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="350.0" y="191.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">노드 B</text>
<text x="350.0" y="208.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">(레이블 없음)</text>
<line x1="172" y1="125" x2="278" y2="115" stroke="#22a05a" stroke-width="1.8" marker-end="url(#eg)"/>
<line x1="172" y1="135" x2="278" y2="190" stroke="#e03131" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#er)"/>
<path d="M218,156 L232,170 M218,170 L232,156" stroke="#e03131" stroke-width="3.5" stroke-linecap="round"/>
<text x="230" y="270" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">&quot;나는 이런 노드로 가고 싶다&quot;</text>
<text x="230" y="295" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">Pod에 적는다. 조건에 맞는 노드로 끌려간다.</text>
<text x="230" y="315" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">다른 Pod가 그 노드에 오는 것은 막지 못한다.</text>
<rect x="460" y="55" width="420" height="305" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="670.0" y="75" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">taint / toleration — 노드가 Pod를 밀어낸다</text>
<rect x="480" y="85" width="150" height="60" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/>
<text x="555.0" y="118.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Pod (허가증 없음)</text>
<rect x="480" y="165" width="150" height="60" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/>
<text x="555.0" y="191.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Pod (toleration)</text>
<text x="555.0" y="208.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">허가증 있음</text>
<rect x="730" y="120" width="130" height="70" rx="8" fill="#fff3e0" stroke="#f08c00" stroke-width="1.5"/>
<text x="795.0" y="151.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">노드 C</text>
<text x="795.0" y="168.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">taint: 출입 제한</text>
<line x1="632" y1="115" x2="728" y2="145" stroke="#e03131" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#er)"/>
<path d="M671,121 L685,135 M671,135 L685,121" stroke="#e03131" stroke-width="3.5" stroke-linecap="round"/>
<line x1="632" y1="195" x2="728" y2="165" stroke="#22a05a" stroke-width="1.8" marker-end="url(#eg)"/>
<text x="670" y="270" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">&quot;허가증 없는 Pod는 오지 마라&quot;</text>
<text x="670" y="295" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">노드에 taint, Pod에 toleration을 적는다.</text>
<text x="670" y="315" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">toleration은 허가일 뿐, 그 노드로 가라는 뜻은 아니다.</text>
</svg>
