# 오류 주입: 존재하는 PVC이지만 그 PVC가 영원히 Pending이라 Pod도 같이 멈추는 경우.
# (ch06-pvc-badsc 자체가 바인딩되지 않으므로, 이 Pod도 실제 볼륨을 마운트하지 않아 안전합니다.)
apiVersion: v1
kind: Pod
metadata:
  name: ch06-pod-pending
  labels:
    edu-chapter: "06-pv-pvc"
spec:
  containers:
  - name: app
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sleep", "3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: ch06-pvc-badsc
