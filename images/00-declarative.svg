<text x="555.0" y="178.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#e03131">Pod 1개 추가</text>
<text x="410" y="225" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">사람은 &quot;어떻게&quot;가 아니라 &quot;무엇을 원하는지&quot;만 적습니다</text>
