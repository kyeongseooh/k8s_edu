# ServiceAccount + Role (이 둘은 처음부터 끝까지 올바른 상태로 유지됩니다)
# namespace는 적지 않습니다 — k()(kubectl -n "$NS")가 적용 시점에 네임스페이스를 넣어줍니다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
