<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430">
<defs><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#374151"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e03131"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22a05a"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#22a05a"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82f6"/></marker><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f08c00"/></marker><marker id="so" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f08c00"/></marker><marker id="ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="sp" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="450.0" y="30" font-size="18" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">회수 정책(Reclaim Policy): PVC를 지우면 PV와 데이터는?</text>
<rect x="20" y="55" width="860" height="170" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="40" y="80" font-size="15" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="start" fill="#111827" font-weight="700">Retain — 남긴다</text>
<rect x="40" y="100" width="150" height="70" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="115.0" y="131.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">PV: Bound</text>
<text x="115.0" y="148.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">PVC와 연결됨</text>
<rect x="275" y="100" width="170" height="70" rx="8" fill="#fff9db" stroke="#e0a800" stroke-width="1.5"/>
<text x="360.0" y="124.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">PV: Released</text>
<text x="360.0" y="141.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">PV와 데이터는 그대로</text>
<text x="360.0" y="155.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">새 PVC는 못 붙음</text>
<rect x="530" y="100" width="150" height="70" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="605.0" y="131.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">PV: Available</text>
<text x="605.0" y="148.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">다시 쓸 수 있음</text>
<rect x="725" y="100" width="135" height="70" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="792.5" y="124.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">PV: Bound</text>
<text x="792.5" y="141.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">새 PVC와 연결</text>
<text x="792.5" y="155.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">데이터 그대로</text>
<line x1="190" y1="135" x2="273" y2="135" stroke="#e03131" stroke-width="1.8" marker-end="url(#er)"/>
<text x="231.5" y="127.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#e03131">PVC 삭제</text>
<line x1="445" y1="135" x2="528" y2="135" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#eb)"/>
<text x="486.5" y="117.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#3b82f6">claimRef</text>
<text x="487" y="131" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#3b82f6">제거(수동)</text>
<line x1="680" y1="135" x2="723" y2="135" stroke="#374151" stroke-width="1.8" marker-end="url(#ea)"/>
<text x="450" y="205" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">실수로 PVC를 지워도 데이터를 살릴 수 있다. 대신 정리는 사람이 직접 해야 한다. → 운영 DB 등 중요한 데이터</text>
<rect x="20" y="245" width="860" height="165" rx="8" fill="#fdecec" stroke="#e03131" stroke-width="1.5"/>
<text x="40" y="270" font-size="15" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="start" fill="#111827" font-weight="700">Delete — 함께 지운다</text>
<rect x="40" y="290" width="150" height="70" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="115.0" y="321.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">PV: Bound</text>
<text x="115.0" y="338.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">PVC와 연결됨</text>
<rect x="275" y="290" width="170" height="70" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="360" y="320" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#e03131" font-weight="700">PV 삭제</text>
<text x="360" y="340" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#e03131">실제 데이터도 삭제</text>
<line x1="190" y1="325" x2="273" y2="325" stroke="#e03131" stroke-width="1.8" marker-end="url(#er)"/>
<text x="231.5" y="317.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#e03131">PVC 삭제</text>
<text x="450" y="392" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">정리가 자동이라 편하다. 대신 PVC를 지우는 순간 데이터도 사라진다. → 임시 데이터, 테스트 환경</text>
</svg>
