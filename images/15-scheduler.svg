<line x1="495" y1="140" x2="558" y2="140" stroke="#374151" stroke-width="1.8" marker-end="url(#ea)"/>
<line x1="740" y1="140" x2="798" y2="140" stroke="#374151" stroke-width="1.8" marker-end="url(#ea)"/>
<text x="355" y="262" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#e03131" font-weight="700">남는 노드가 0개면 → Pending + FailedScheduling</text>
