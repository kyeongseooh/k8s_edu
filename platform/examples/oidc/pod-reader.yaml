apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oidc-edu-pod-reader
rules:
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-edu-pod-readers
subjects:
- kind: Group
  name: oidc:edu-readers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: oidc-edu-pod-reader
  apiGroup: rbac.authorization.k8s.io
