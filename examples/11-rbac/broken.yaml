# 고장 실습: deployer에게 Deployment 관리 권한을 주려고 했는데...
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-manager
rules:
- apiGroups: ["apps"]                # Deployment는 apps 그룹에 속한다
  resources: ["deployments"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-deploy-manager
subjects:
- kind: ServiceAccount
  name: deployr                      # 오타! 실제 ServiceAccount 이름은 deployer
  namespace: edu-lab
roleRef:
  kind: Role
  name: deploy-manager
  apiGroup: rbac.authorization.k8s.io
