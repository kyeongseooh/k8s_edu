apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-edu02
spec:
  replicas: 2
  selector:                    # "어떤 Pod가 내 관리 대상인가"를 레이블로 지정
    matchLabels:
      app: edu02-web
  template:                    # Pod를 찍어낼 틀
    metadata:
      labels:
        app: edu02-web         # ← selector.matchLabels와 반드시 일치
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-edu02
spec:
  selector:
    app: edu02-web             # app=edu02-web 레이블이 붙은 Pod들에게 트래픽 전달
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
