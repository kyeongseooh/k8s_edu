# 내 namespace에서만 실습: replicas를 4 → 3 → 4로 바꾸며 PDB 관찰
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-web
spec:
  replicas: 4
  selector:
    matchLabels:
      app: catalog-web
  template:
    metadata:
      labels:
        app: catalog-web
    spec:
      containers:
      - name: catalog-web
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-web-pdb
spec:
  minAvailable: 3        # 정상: 4개 중 3개 유지, 1개 여유
  selector:
    matchLabels:
      app: catalog-web
