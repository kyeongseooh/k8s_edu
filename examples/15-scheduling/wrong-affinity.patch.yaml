# Deployment 전체가 아니라 기존 Deployment에 합칠 변경분이다.
spec:
  template:
    metadata:
      labels:
        exercise: misplaced  # 고장 난 리비전의 Pod만 찾기 위한 꼬리표
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists  # 이 라벨이 있는 노드만 후보로 남는다.
