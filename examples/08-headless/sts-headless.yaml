# 각 Pod가 "자기 호스트네임"을 응답하는 StatefulSet + headless Service
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ch08-app
spec:
  replicas: 2
  serviceName: ch08-svc
  selector:
    matchLabels:
      app: ch08-app
  template:
    metadata:
      labels:
        app: ch08-app
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        command:
          - "/bin/sh"
          - "-c"
          - "echo \"$(hostname)\" > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
        ports:
        - containerPort: 80
          name: web
---
apiVersion: v1
kind: Service
metadata:
  name: ch08-svc
spec:
  clusterIP: None            # ★ 이 한 줄이 headless 서비스를 만든다
  selector:
    app: ch08-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
