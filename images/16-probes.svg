<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
<defs><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#374151"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e03131"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22a05a"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#22a05a"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82f6"/></marker><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f08c00"/></marker><marker id="so" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f08c00"/></marker><marker id="ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="sp" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450.0" y="30" font-size="18" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">readinessProbe와 livenessProbe: 실패했을 때 일어나는 일이 다르다</text>
<rect x="20" y="55" width="420" height="325" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="230.0" y="75" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">readinessProbe — &quot;요청을 받을 준비가 됐나?&quot;</text>
<rect x="40" y="100" width="130" height="55" rx="8" fill="#fff3e0" stroke="#f08c00" stroke-width="1.5"/>
<text x="105.0" y="131.0" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Service</text>
<rect x="280" y="85" width="140" height="55" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="350.0" y="109.0" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Pod A</text>
<text x="350.0" y="126.0" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">READY 1/1</text>
<rect x="280" y="165" width="140" height="55" rx="8" fill="#fff9db" stroke="#e0a800" stroke-width="1.5"/>
<text x="350.0" y="189.0" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">Pod B</text>
<text x="350.0" y="206.0" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">READY 0/1</text>
<line x1="172" y1="122" x2="278" y2="112" stroke="#22a05a" stroke-width="1.8" marker-end="url(#eg)"/>
<line x1="172" y1="135" x2="278" y2="190" stroke="#e03131" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#er)"/>
<path d="M218,155 L232,169 M218,169 L232,155" stroke="#e03131" stroke-width="3.5" stroke-linecap="round"/>
<text x="230" y="258" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#f08c00" font-weight="700">실패하면: Service 대상에서 제외</text>
<text x="230" y="283" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">컨테이너는 그대로 둔다 (재시작하지 않음)</text>
<text x="230" y="303" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">다시 성공하면 자동으로 복귀한다</text>
<text x="230" y="340" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">예: 시작 중, 일시적인 과부하, 의존 서비스 대기</text>
<rect x="460" y="55" width="420" height="325" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="670.0" y="75" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">livenessProbe — &quot;살아 있나?&quot;</text>
<rect x="490" y="110" width="150" height="80" rx="8" fill="#fdecec" stroke="#e03131" stroke-width="1.5"/>
<text x="565.0" y="139.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">컨테이너</text>
<text x="565.0" y="156.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">응답 없음</text>
<text x="565.0" y="170.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">(멈춘 상태)</text>
<rect x="710" y="110" width="150" height="80" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="785.0" y="146.5" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">새 컨테이너</text>
<text x="785.0" y="163.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">RESTARTS +1</text>
<line x1="642" y1="150" x2="708" y2="150" stroke="#e03131" stroke-width="1.8" marker-end="url(#er)"/>
<text x="675.0" y="142.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#e03131">재시작</text>
<text x="670" y="258" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#e03131" font-weight="700">실패하면: 컨테이너를 재시작</text>
<text x="670" y="283" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">Pod는 그대로이고 안의 컨테이너만 새로 뜬다</text>
<text x="670" y="303" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">(Pod 이름·IP 유지, RESTARTS 증가)</text>
<text x="670" y="340" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">예: 교착 상태, 무한 루프처럼 재시작해야 풀리는 문제</text>
</svg>
