# 기능 확인(복구)용 — 실제 PVC가 아니라 emptyDir을 씁니다.
# (이 클러스터의 nfs-client는 reclaimPolicy: Retain이라, 실제로 Bound되는 PVC는
#  이 실습에서 만들지 않습니다. 여기서는 "앱이 다시 뜨는지"만 확인합니다 — 영속성 테스트가 아닙니다.)
apiVersion: v1
kind: Pod
metadata:
  name: ch06-pod-recovery
  labels:
    edu-chapter: "06-pv-pvc"
spec:
  containers:
  - name: app
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sleep", "3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    emptyDir: {}
