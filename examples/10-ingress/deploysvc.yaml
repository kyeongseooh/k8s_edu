# Ingress 경로 라우팅 실습용 — 같은 웹 서버를 이름만 다르게 3벌 (naver / cloud / platform)
apiVersion: v1
kind: Service
metadata:
  name: ch10-naver
  labels:
    app: ch10-naver
spec:
  type: ClusterIP
  selector:
    app: ch10-naver
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ch10-naver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ch10-naver
  template:
    metadata:
      labels:
        app: ch10-naver
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "echo naver > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
          ports:
            - containerPort: 80
