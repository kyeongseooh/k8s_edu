# 의도적 오류 예제: selector 레이블에 오타가 있어 어떤 Pod와도 연결되지 않습니다.
# -> Service는 생성되지만 Endpoints가 비어 있어 트래픽이 어디로도 가지 못합니다.
# (실무에서 "서비스 만들었는데 응답이 없어요"의 가장 흔한 원인 중 하나)
apiVersion: v1
kind: Service
metadata:
  name: svc-edu03
spec:
  type: ClusterIP
  selector:
    app: edu03-wbe            # 오타! 실제 Pod 레이블은 edu03-web (의도적 오류)
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
