# Secret 값을 파일로 넣기
apiVersion: v1
kind: Pod
metadata:
  name: secret-file
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: db
      mountPath: /etc/db           # /etc/db/DB_USER, /etc/db/DB_PASSWORD 파일이 생긴다
      readOnly: true
  volumes:
  - name: db
    secret:                        # configMap -> secret
      secretName: db-secret        # (ConfigMap은 name, Secret은 secretName)
      defaultMode: 0400            # 파일 권한: 소유자만 읽기
