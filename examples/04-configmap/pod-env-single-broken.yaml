# 의도적 오류 예제: ConfigMap에 없는 key(usernam, 오타)를 참조합니다.
# -> 컨테이너가 시작조차 못하고 CreateContainerConfigError 상태가 됩니다.
apiVersion: v1
kind: Pod
metadata:
  name: config-reader
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: reader
    image: nginx:1.27-alpine
    env:
    - name: USERNAME
      valueFrom:
        configMapKeyRef:
          name: cm-edu04
          key: usernam           # 오타! 실제 key는 username (의도적 오류)
    command: ["sleep", "3600"]
    imagePullPolicy: IfNotPresent
  restartPolicy: Always
