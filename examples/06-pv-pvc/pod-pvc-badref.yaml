# 오류 주입 ②: 존재하지 않는(오타) PVC 이름을 참조 → 스케줄러가 PVC를 찾지 못해 Pod가 Pending
apiVersion: v1
kind: Pod
metadata:
  name: ch06-pod-badref
  labels:
    edu-chapter: "06-pv-pvc"
spec:
  containers:
  - name: app
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sleep", "3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: ch06-pvc-typo
