<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330">
<defs><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#374151"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e03131"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22a05a"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#22a05a"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b82f6"/></marker><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f08c00"/></marker><marker id="so" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f08c00"/></marker><marker id="ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="sp" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker></defs>
<rect width="920" height="330" fill="#ffffff"/>
<text x="460.0" y="30" font-size="18" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">작업을 실행하는 두 가지 방법</text>
<rect x="20" y="55" width="430" height="255" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="235.0" y="75" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">일반 Operator (Bash, Python)</text>
<rect x="45" y="100" width="380" height="110" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="235" y="122" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">작업 Pod (Airflow 이미지)</text>
<rect x="65" y="135" width="340" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="235.0" y="168.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">DAG에 적힌 코드를 여기서 직접 실행</text>
<text x="235" y="240" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">간단하다. 코드가 DAG 파일 안에 있다</text>
<text x="235" y="262" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">필요한 라이브러리는 Airflow 이미지에 있어야 한다</text>
<text x="235" y="284" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#22a05a">→ 가벼운 작업, 조율(orchestration)용</text>
<rect x="470" y="55" width="430" height="255" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="685.0" y="75" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">KubernetesPodOperator</text>
<rect x="490" y="100" width="180" height="110" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="580" y="122" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">작업 Pod</text>
<text x="580" y="140" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">(Airflow 이미지)</text>
<rect x="505" y="152" width="150" height="45" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="580.0" y="169.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827">Pod를 띄우고</text>
<text x="580.0" y="184.5" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827">끝날 때까지 기다림</text>
<rect x="720" y="100" width="160" height="110" rx="8" fill="#fff3e0" stroke="#f08c00" stroke-width="1.5"/>
<text x="800" y="122" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">실행 Pod</text>
<text x="800" y="140" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">(내 이미지: Harbor)</text>
<rect x="735" y="152" width="130" height="45" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="800.0" y="177.0" font-size="11" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827">report.py 실행</text>
<line x1="672" y1="155" x2="718" y2="155" stroke="#f08c00" stroke-width="1.8" marker-end="url(#eo)"/>
<text x="685" y="240" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">실제 일은 내 이미지 안에서 한다</text>
<text x="685" y="262" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">언어·라이브러리가 Airflow와 무관하다</text>
<text x="685" y="284" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#f08c00">→ 무거운 작업, 팀마다 다른 실행 환경</text>
</svg>
