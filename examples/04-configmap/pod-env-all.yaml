apiVersion: v1
kind: Pod
metadata:
  name: config-reader
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: reader
    image: nginx:1.27-alpine
    command:
      - sleep
      - "3600"
    envFrom:                    # env 대신 envFrom: ConfigMap 전체를 환경변수로
    - configMapRef:
        name: cm-edu04
    imagePullPolicy: IfNotPresent
  restartPolicy: Always
