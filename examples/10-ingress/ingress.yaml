# 구조 참고용 템플릿입니다. host는 본인 네임스페이스 기반의 .invalid 호스트로 바뀌어야 하므로,
# 본문에서는 ${NS}.invalid 를 채운 heredoc으로 실제 적용합니다 (아래는 읽기용).
# .invalid는 RFC 2606이 "절대 실제로 쓰이지 않음"을 보장하는 예약 TLD입니다 — 운영 호스트와 충돌하지 않습니다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ch10-path-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: learner.invalid
    http:
      paths:
      - path: /naver
        pathType: Prefix
        backend:
          service:
            name: ch10-naver
            port:
              number: 80
      - path: /cloud
        pathType: Prefix
        backend:
          service:
            name: ch10-cloud
            port:
              number: 80
      - path: /platform
        pathType: Prefix
        backend:
          service:
            name: ch10-platform
            port:
              number: 80
