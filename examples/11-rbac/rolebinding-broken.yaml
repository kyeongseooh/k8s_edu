# 장애 재현용: roleRef.name에 오타가 있어, 존재하지 않는 Role("pod-reader-old")을 참조합니다.
# subjects에도 namespace를 적지 않음 — 같은 네임스페이스의 SA라면 생략 가능(API 기본값).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer-bot-pod-reader
subjects:
- kind: ServiceAccount
  name: viewer-bot
roleRef:
  kind: Role
  name: pod-reader-old
  apiGroup: rbac.authorization.k8s.io
