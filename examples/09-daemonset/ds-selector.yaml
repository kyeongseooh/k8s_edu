# 고장 실습: disktype=ssd 레이블이 붙은 노드에만 배치하는 DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ssd-agent
spec:
  selector:
    matchLabels:
      app: ssd-agent
  template:
    metadata:
      labels:
        app: ssd-agent
    spec:
      terminationGracePeriodSeconds: 5
      nodeSelector:
        disktype: ssd                # 이 레이블이 붙은 노드에만
      containers:
      - name: agent
        image: busybox:1.36
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        command: ["sh", "-c"]
        args:
        - while true; do echo "$(date +%T) ssd-agent running on $NODE_NAME"; sleep 10; done
