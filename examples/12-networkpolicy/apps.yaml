# db(서버) 하나와, 서로 다른 레이블을 가진 클라이언트 두 개
apiVersion: v1
kind: Pod
metadata:
  name: db
  labels:
    app: db
spec:
  containers:
  - name: nginx                  # DB 역할을 대신하는 웹 서버
    image: nginx:1.27-alpine
    command: ["sh", "-c"]
    args:
    - echo "db data" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
  - port: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  labels:
    role: frontend               # db에 접속해도 되는 Pod
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: other
  labels:
    role: other                  # db에 접속하면 안 되는 Pod
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
