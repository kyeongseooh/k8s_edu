apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3                  # Pod를 항상 3개로 유지
  selector:                    # 어떤 Pod가 내 관리 대상인지 레이블로 지정
    matchLabels:
      app: web
  template:                    # Pod를 찍어 낼 틀 (01장의 Pod YAML과 같은 모양)
    metadata:
      labels:
        app: web               # selector.matchLabels와 반드시 같아야 한다
    spec:
      containers:
      - name: nginx
        image: nginx:1.26-alpine
        ports:
        - containerPort: 80
