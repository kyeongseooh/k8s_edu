# 각 Pod가 "자기 이름-IP"를 응답하는 웹 서버 2대 + NodePort 서비스
# 로드밸런싱 확인용
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edu-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edu-web
  template:
    metadata:
      labels:
        app: edu-web
    spec:
      containers:
        - name: web
          image: ubuntu/apache2:latest
          command:
            - "/bin/sh"
            - "-c"
            - >
              echo "ServerName localhost" > /etc/apache2/conf-available/server-name.conf &&
              a2enconf server-name &&
              echo "$(hostname)-$(hostname -i)" > /var/www/html/index.html &&
              apache2ctl -DFOREGROUND
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: edu-service
spec:
  type: NodePort
  selector:
    app: edu-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
