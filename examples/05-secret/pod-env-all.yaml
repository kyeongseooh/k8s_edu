apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: reader
    image: nginx:1.27-alpine
    command:
      - sleep
      - "3600"
    envFrom:
      - secretRef:
          name: secret-edu05
    imagePullPolicy: IfNotPresent
  restartPolicy: Always
