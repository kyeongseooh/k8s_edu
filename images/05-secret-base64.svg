<text x="285" y="218" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#e03131">누구나 한 줄로 되돌릴 수 있음:  base64 -d</text>
<text x="440" y="265" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">Secret을 안전하게 만드는 것은 base64가 아니라 &quot;누가 조회할 수 있는가(RBAC)&quot;와 저장소 암호화입니다</text>
