# 정상 기준: PV 없이(emptyDir) 이름/식별만 유지되는 StatefulSet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ch07-web
spec:
  serviceName: ch07-web            # 8장에서 다룰 headless Service 이름 (아래 Service와 일치)
  replicas: 3
  selector:
    matchLabels:
      app: ch07-web
  template:
    metadata:
      labels:
        app: ch07-web
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
      volumes:
      - name: www
        emptyDir: {}              # ★ PVC가 아니라 emptyDir — Pod 재생성 시 데이터는 사라짐
---
apiVersion: v1
kind: Service
metadata:
  name: ch07-web
  labels:
    app: ch07-web
spec:
  clusterIP: None                 # headless (8장에서 자세히)
  selector:
    app: ch07-web
  ports:
  - port: 80
    name: web
