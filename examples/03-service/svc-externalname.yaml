# ExternalName 예시: 클러스터 "밖"의 사내 DB/API를 내부 DNS 이름으로 감싸는 용도.
# 실제로 존재하는 외부 도메인이 아니라 예시용 가상 주소이며, 이 실습에서는
# 리소스 생성/조회만 하고 실제로 호출(curl)하지는 않습니다.
apiVersion: v1
kind: Service
metadata:
  name: svc-edu03-ext
spec:
  type: ExternalName
  externalName: legacy-db.internal.example   # 가리킬 외부(사내) 도메인 — 예시용 가상 주소
