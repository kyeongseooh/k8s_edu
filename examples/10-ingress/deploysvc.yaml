# Ingress 경로 라우팅 실습용 — 같은 웹 서버를 이름만 다르게 3벌 (naver / cloud / platform)
apiVersion: v1
kind: Service
metadata:
  name: naver
spec:
  type: NodePort
  selector:
    app: naver
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: naver
  template:
    metadata:
      labels:
        app: naver
    spec:
      containers:
        - name: naver
          image: ubuntu/apache2:latest
          ports:
            - containerPort: 80
---
