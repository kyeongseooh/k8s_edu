<text x="230" y="392" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">인증(Authentication): 누구인가 → Keycloak</text>
<text x="690" y="392" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">인가(Authorization): 무엇을 할 수 있는가 → RBAC</text>
