# ds.yaml + toleration: 컨트롤 플레인 노드에도 배치한다
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      terminationGracePeriodSeconds: 5
      tolerations:                   # "이 taint가 있는 노드에도 들어가겠다"는 허가증 (15장에서 자세히)
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: agent
        image: busybox:1.36
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        command: ["sh", "-c"]
        args:
        - while true; do echo "$(date +%T) agent running on $NODE_NAME"; sleep 10; done
