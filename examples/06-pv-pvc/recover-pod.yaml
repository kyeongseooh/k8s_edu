# Retain으로 남은 PV를 recover-pvc로 다시 연결한 뒤, 그 안의 데이터를 읽는 Pod
apiVersion: v1
kind: Pod
metadata:
  name: recover-pod
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: recover-pvc
