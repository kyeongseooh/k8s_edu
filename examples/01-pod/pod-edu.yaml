apiVersion: v1
kind: Pod
metadata:
  name: pod-edu01
  labels:
    app: edu01-web
spec:
  containers:
  - name: web
    image: nginx:1.27-alpine
    imagePullPolicy: IfNotPresent
    command:
      - "/bin/sh"
      - "-c"
      - >
        echo "$(hostname)-$(hostname -i)" > /usr/share/nginx/html/index.html &&
        nginx -g 'daemon off;'
    ports:
    - containerPort: 80
