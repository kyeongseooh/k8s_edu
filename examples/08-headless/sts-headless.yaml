# 각 Pod가 "자기 호스트네임-IP"를 응답하는 StatefulSet + headless Service
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edu-statefulset
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edu-app
  serviceName: "pod-edu-service"
  template:
    metadata:
      labels:
        app: edu-app
    spec:
      containers:
      - name: web
        image: ubuntu/apache2:latest
        command:
          - "/bin/sh"
          - "-c"
          - >
            echo "ServerName localhost" > /etc/apache2/conf-available/server-name.conf &&
            a2enconf server-name &&
            echo "$(hostname)-$(hostname -i)" > /var/www/html/index.html &&
            apache2ctl -DFOREGROUND
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pod-edu-service
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: edu-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
