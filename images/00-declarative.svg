<rect width="820" height="250" fill="#ffffff"/>
<text x="410.0" y="30" font-size="18" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">선언형: 원하는 상태를 적어 두면 쿠버네티스가 맞춘다</text>
<rect x="20" y="80" width="200" height="110" rx="8" fill="#f1eafd" stroke="#7c3aed" stroke-width="1.5"/>
<text x="120.0" y="131.5" font-size="14" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">원하는 상태 (YAML)</text>
<text x="120.0" y="149.5" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">&quot;nginx Pod 3개&quot;</text>
<rect x="300" y="80" width="200" height="110" rx="8" fill="#e8f1fd" stroke="#3b82f6" stroke-width="1.5"/>
<text x="400.0" y="124.0" font-size="14" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">컨트롤러</text>
<text x="400.0" y="142.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">두 상태를 계속 비교</text>
<text x="400.0" y="157.0" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">다르면 조치</text>
<rect x="610" y="80" width="200" height="110" rx="8" fill="#e7f6ec" stroke="#22a05a" stroke-width="1.5"/>
<text x="710.0" y="131.5" font-size="14" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#111827" font-weight="700">현재 상태 (클러스터)</text>
<text x="710.0" y="149.5" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">&quot;지금 Pod 2개&quot;</text>
