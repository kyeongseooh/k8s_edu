# 고장 실습: 포트 이름이 틀렸다
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: edu-airflow
  namespace: edu-airflow
spec:
  selector:                    # 어떤 Service를 수집 대상으로 할지 (Service의 레이블)
    matchLabels:
      component: statsd
      release: airflow
  endpoints:
  - port: metrics              # 틀림! Service에는 이런 이름의 포트가 없다
    path: /metrics
    interval: 15s              # 15초마다 수집
