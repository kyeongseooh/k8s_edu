# 의도적 오류 예제: 클러스터의 어떤 노드에도 없는 레이블을 요구합니다.
# -> 스케줄링될 노드를 찾지 못해 Pod가 Pending 상태로 멈춥니다.
# (주의: 실제 노드에 레이블을 붙이지 않습니다 — 노드는 절대 건드리지 않습니다)
apiVersion: v1
kind: Pod
metadata:
  name: pod-edu01
  labels:
    app: edu01-web
spec:
  nodeSelector:
    gpu: "true"           # 이 레이블을 가진 노드가 클러스터에 없음 (의도적 오류)
  containers:
  - name: web
    image: nginx:1.27-alpine
    imagePullPolicy: IfNotPresent
    command:
      - "/bin/sh"
      - "-c"
      - >
        echo "$(hostname)-$(hostname -i)" > /usr/share/nginx/html/index.html &&
        nginx -g 'daemon off;'
    ports:
    - containerPort: 80
