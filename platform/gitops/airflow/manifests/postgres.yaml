# Airflow가 상태(DAG 실행 이력 등)를 저장하는 데이터베이스
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"       # Airflow보다 먼저 만든다
spec:
  serviceName: airflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: airflow-postgres
  template:
    metadata:
      labels:
        app: airflow-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:16.4
        envFrom:
        - secretRef:
            name: airflow-db                 # DB 이름·계정·비밀번호 (kubectl로 미리 만든다)
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "airflow", "-d", "airflow"]
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 512Mi}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      volumeMode: Filesystem
      storageClassName: nfs-client
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app: airflow-postgres
  ports:
  - port: 5432
    targetPort: 5432
