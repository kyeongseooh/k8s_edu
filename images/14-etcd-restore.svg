<text x="440" y="228" font-size="13" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#f08c00">스냅샷 시점(09:00)의 상태로 돌아간다</text>
