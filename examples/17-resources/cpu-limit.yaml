# CPU 상한만 다른 두 Pod. 같은 계산을 시켜서 걸리는 시간을 비교한다
apiVersion: v1
kind: Pod
metadata:
  name: cpu-fast
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: 100m
        memory: 32Mi
      limits:
        cpu: "1"             # 1 코어까지 쓸 수 있다
        memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-slow
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: 100m
        memory: 32Mi
      limits:
        cpu: 100m            # 0.1 코어까지만 쓸 수 있다
        memory: 64Mi
