<polyline points="335,202 335,305 488,305" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#eb)"/>
<text x="405" y="297" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#3b82f6">PVC가 생기면</text>
<text x="230" y="250" font-size="12" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Droid Sans Fallback',sans-serif" text-anchor="middle" fill="#4b5563">PVC = 요청서 (개발자가 작성)</text>
